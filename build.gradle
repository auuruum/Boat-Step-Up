buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath('net.fabricmc:fabric-loom:1.8-SNAPSHOT') {
            exclude group: 'com.google.code.gson', module: 'gson'
        }
        classpath 'com.google.code.gson:gson:2.10.1'
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
        classpath 'net.neoforged:moddev-gradle:2.0.78'
    }
}

subprojects {
    group = mod_group_id
    version = "${minecraft_version}-${mod_version}"

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        mavenCentral()
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
            withSourcesJar()
        }

        if (project.name != 'fabric') {
            sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
        }
        sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }

        tasks.named('processResources', ProcessResources).configure {
            def props = rootProject.ext.modProps()
            inputs.properties props
            filesMatching(['fabric.mod.json', 'quilt.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
                expand props
            }
        }
    }
}

ext.modProps = {
    [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        fabric_loader_version: fabric_loader_version,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        forge_loader_version_range: forge_loader_version_range,
        neoforge_version: neoforge_version,
        neoforge_version_range: neoforge_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_group_id: mod_group_id,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
}
