buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath('net.fabricmc:fabric-loom:1.13.4') {
            exclude group: 'com.google.code.gson', module: 'gson'
        }
        classpath 'com.google.code.gson:gson:2.10.1'
        classpath 'net.minecraftforge:forgegradle:7.0.17'
        classpath 'net.neoforged:moddev-gradle:2.0.144'
    }
}

plugins {
    id 'base'
}

subprojects {
    group = mod_group_id
    version = "${minecraft_version}-${mod_version}"

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
            withSourcesJar()
        }

        if (project.name != 'fabric') {
            sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
        }
        sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }

        tasks.named('processResources', ProcessResources).configure {
            def props = rootProject.ext.modProps()
            inputs.properties props
            filesMatching(['fabric.mod.json', 'quilt.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
                expand props
            }
        }
    }
}

tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds one experimental jar containing Fabric, Quilt, Forge, and NeoForge metadata/classes.'
    archiveBaseName.set(mod_id)
    archiveVersion.set("${minecraft_version}-${mod_version}")
    archiveClassifier.set('universal')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn ':fabric:remapJar', ':forge:jar', ':neoforge:jar'

    from({ zipTree(project(':fabric').tasks.named('remapJar').get().archiveFile.get().asFile) })
    from({ zipTree(project(':forge').tasks.named('jar').get().archiveFile.get().asFile) })
    from({ zipTree(project(':neoforge').tasks.named('jar').get().archiveFile.get().asFile) })
}

tasks.named('build') {
    dependsOn ':fabric:build', ':forge:build', ':neoforge:build', tasks.named('universalJar')
}

ext.modProps = {
    [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        fabric_minecraft_version_range: fabric_minecraft_version_range,
        fabric_loader_version: fabric_loader_version,
        forge_version: forge_version,
        forge_version_range: forge_version_range,
        forge_loader_version_range: forge_loader_version_range,
        neoforge_version: neoforge_version,
        neoforge_version_range: neoforge_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_group_id: mod_group_id,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
}
